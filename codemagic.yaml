workflows:
  spellful-ios-prepare:
    name: Spellful iOS Preparation
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build Spellful web app
        script: npm run build
      - name: Generate native iOS project
        script: npx cap add ios
      - name: Verify iOS project
        script: ls -la ios/App
